[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-memory-engine"
version = "0.1.0"
description = "Grounded L1/L2/L3 retrieval and runtime support for paper Chips"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Yunbo-max/chip-memory-engine"
Documentation = "https://github.com/Yunbo-max/chip-memory-engine/tree/main/docs"

[project.scripts]
chip-memory = "chip_memory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
